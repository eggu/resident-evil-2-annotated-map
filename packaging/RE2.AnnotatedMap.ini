; RE2 Annotated Map - Survivor's Notes
; Install beside the plugin in <game folder>/scripts/ (scripts/RE2.AnnotatedMap.asi).
; Close the game before editing, save this file, then restart the game.
; Keep your existing INI when upgrading; settings changed in game are saved here automatically.
; An INI from an older version is updated once with the new keys below; its values are kept.

[MapOverlay]
; Settings format, written by the mod. Do not edit.
Version=5
; 1 = on, 0 = off. Master switch for all map overlays. Default: 1.
All=1
; Room names and save/item-box markers. Default: 1.
Rooms=1
; Locks and keys. Default: 0.
Locks=0
; Key items. Default: 0.
Items=0
; Files and area maps. Default: 0.
Documents=0
; Puzzle and device markers. Default: 0.
Puzzles=0
; 1 = English, 0 = Korean. In-game key: backslash (the won sign on Korean keyboards). Default: 1.
English=1
; Monster spawns. In-game key: 8. Default: 0.
Enemies=0
; Events (spoilers: where story scenes start, hidden once they have played). In-game key: 6. Default: 0.
Events=0
; Ammunition, recovery items, Ink Ribbons and other common pickups. In-game key: 7. Default: 0.
CommonItems=0
; Map live rank display: 0 = off, 1 = on. Default: 0. Restart after changing.
Rank=0
; Status legend (bottom left) and size/opacity values (top left). In-game key: ~ (the key left of 1). Default: 1.
Legend=1
; 1 = visited rooms, 2 = rooms revealed by a floor map, 3 = all rooms (spoilers).
; In-game key: 9 cycles through the three scopes. Default: 1.
Scope=1
; Room and key-item name size: 50-200, steps of 10. 100 = the former 80% (older files are converted once).
; In-game keys: minus/plus (main keyboard or numpad). Default: 100.
NameSize=100
; Room and key-item name opacity: 10-100, steps of 10.
; In-game keys: [ and ]. Default: 70.
NameOpacity=70
; Marker names (key items, lock keys, maps, documents, puzzles, common items): 1 = all names, 2 = all except common items,
; 0 = hidden. In-game key: H cycles 1 -> 2 -> 0. Default: 0. (Versions before 1.2 only knew 1 = on and 0 = off: those
; values keep their meaning, 1 = all and 0 = hidden.)
ItemNames=0
; Map icon size: 50-200, steps of 10. In-game keys: Modifier + minus/plus. Default: 100.
IconSize=100
; Map icon opacity: 10-100, steps of 10. In-game keys: Modifier + [ and ]. Default: 80.
IconOpacity=80
; Key held for the icon keys: Shift or Ctrl. Default: Shift (the game itself uses Ctrl).
Modifier=Shift
; Lock markers: 1 = beside the door, in the room not entered yet (RE1 HD style; doors to another
; floor stay on the door), 0 = on the door. Default: 1. (Files older than version 5 are set to 1 once.)
LockSide=1
; Display: Auto = SD when the HD pack (bio2hd.asi) is not loaded or config.ini [DLL] RetroMode/LowResEnable is on, else HD; or force HD / SD.
; SD draws 1x markers and pixel-font names; size, opacity, item names and rank are HD only. Restart after changing. Default: Auto.
DisplayMode=Auto
